name: Collect Traffic Data

# Scheduled collection runs on Vercel Cron (see vercel.json).
# This workflow is kept as a manual fallback only — GitHub disables `schedule`
# triggers after 60 days without repo activity, which is exactly what we want
# to avoid, so no `schedule` trigger is defined here.
on:
  workflow_dispatch: # Manual trigger only

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Collect traffic data
        run: pnpm db:collect
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
